[project]
name = "time-series-colombia"
version = "1.0.0"
description = "Modelado Box-Jenkins de la TRM de Colombia y pronóstico con bandas de riesgo (ARIMA + GARCH)"
readme = "README.md"
authors = [
    { name = "JuanHV24" }
]
requires-python = ">=3.13"
dependencies = [
    "arch>=8.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
trm = "trm.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trm"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
